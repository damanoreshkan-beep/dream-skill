<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="dream">
  <defs>
    <linearGradient id="lum" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#5CE4DC"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- DreamStudio line-glyph language: crescent moon + spark, stroke only -->
  <g transform="scale(4)" fill="none" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" stroke="url(#lum)"/>
    <path d="M18.6 3.1 19.55 5.05 21.5 6 19.55 6.95 18.6 8.9 17.65 6.95 15.7 6 17.65 5.05 Z" stroke="#5CE4DC"/>
  </g>
</svg>
