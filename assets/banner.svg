<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="dream — a one-breath awareness primer">
  <defs>
    <linearGradient id="lum" x1="150" y1="120" x2="430" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#5CE4DC"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#5CE4DC"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2B84B" stop-opacity=".30"/>
      <stop offset=".4" stop-color="#5CE4DC" stop-opacity=".13"/>
      <stop offset="1" stop-color="#5CE4DC" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#000000"/>
  <ellipse cx="290" cy="200" rx="250" ry="220" fill="url(#halo)"/>

  <!-- mark: moon + spark, DreamStudio line-glyph -->
  <g transform="translate(230 118) scale(6.6)" fill="none" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" stroke="url(#lum)"/>
    <path d="M18.6 3.1 19.55 5.05 21.5 6 19.55 6.95 18.6 8.9 17.65 6.95 15.7 6 17.65 5.05 Z" stroke="#5CE4DC"/>
  </g>

  <!-- wordmark -->
  <text x="560" y="188" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="128" font-weight="700" letter-spacing="-4" fill="url(#word)">dream</text>
  <text x="564" y="246" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="25" font-weight="500" letter-spacing="4.5" fill="#8A9099">A ONE-BREATH AWARENESS PRIMER</text>
</svg>
